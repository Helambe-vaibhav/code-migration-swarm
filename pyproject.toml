[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-migration-swarm"
version = "1.0.0"
description = "Autonomous Enterprise Code Migration & Test-Driven Refactoring Swarm (LangGraph)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vaibhav Helambe", email = "helambevaibhav2002@gmail.com"}
]
keywords = ["langgraph", "langchain", "multi-agent", "code-migration", "ast", "tdd", "self-healing", "genai"]
dependencies = [
    "langgraph>=1.2.0",
    "langchain>=1.4.0",
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
refactor-swarm = "cli:run_cli"
refactor-dashboard = "server:app"
